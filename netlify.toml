[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# Unknown API routes get a JSON 404 instead of the app shell.
[[redirects]]
  from = "/api/*"
  to = "/api-not-found.json"
  status = 404
  force = true

# Single-page app: every other route loads index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
